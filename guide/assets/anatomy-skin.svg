<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Haut: Schicht für Schicht</title><desc id="desc">Schnitt durch die Haut und das darunterliegende Gewebe. Vereinfachte Lernskizze, nicht maßstabsgetreu.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#152d40}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526773}.label{font-size:23px;font-weight:700}.small{font-size:18px;fill:#526773}.bone{fill:#d8eeeb;stroke:#16766f;stroke-width:4}.line{fill:none;stroke:#526773;stroke-width:2}.disc{fill:#e8b964;stroke:#9c702b;stroke-width:2}</style></defs><rect width="1100" height="760" rx="26" fill="#f8faf7"/><text x="48" y="63" class="title">Haut: Schicht für Schicht</text><text x="48" y="98" class="sub">Schnitt durch die Haut und das darunterliegende Gewebe</text><rect x="88" y="200" width="580" height="59" rx="12" fill="#edd5bf" stroke="#956f55" stroke-width="3"/><path d="M88 255H668V439H88Z" fill="#c7e5df" stroke="#16766f" stroke-width="3"/><path d="M88 439H668V596H88Z" fill="#f4dfa7" stroke="#ac8537" stroke-width="3"/><g fill="#f7eac9" stroke="#c0a15b" stroke-width="2"><circle cx="136" cy="493" r="28"/><circle cx="201" cy="539" r="30"/><circle cx="281" cy="488" r="29"/><circle cx="354" cy="546" r="31"/><circle cx="436" cy="496" r="30"/><circle cx="520" cy="548" r="31"/><circle cx="604" cy="493" r="28"/></g><path d="M121 382H609M164 384V326M415 384V324M560 384V350" stroke="#b76268" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M111 407H594M258 407V363M485 407V370" stroke="#4c8aa1" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M331 174L353 261Q376 329 347 352Q321 363 311 328L294 260" stroke="#526773" stroke-width="5" fill="none"/>
<path class="line" d="M670 229H718"/><text x="742" y="222" class="label">Oberhaut</text><text x="742" y="253" class="small">Epidermis</text><path class="line" d="M670 347H718"/><text x="742" y="340" class="label">Lederhaut</text><text x="742" y="372" class="small">Dermis · mit Blutgefäßen</text><path class="line" d="M670 517H718"/><text x="742" y="510" class="label">Unterhaut</text><text x="742" y="542" class="small">Subcutis · u. a. Fettgewebe</text><text x="91" y="652" class="small">Eine Wunde kann unterschiedlich tief reichen. Dieses Schema zeigt intaktes Gewebe.</text><path d="M48 697H1052" stroke="#d4dfdc"/><text x="48" y="730" class="small">FSP · Zeigen → benennen → in einfachen Worten erklären · Schema, nicht maßstabsgetreu</text></svg>
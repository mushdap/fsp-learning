<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc"><title id="title">Herz &amp; Kreislauf</title><desc id="desc">Schematic blood flow: body to right atrium and right ventricle, lungs, left atrium and left ventricle, then body. Heart sides are labelled anatomically.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#127c80"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17334b}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:19px}.line{fill:none;stroke:#517181;stroke-width:2}.organ{fill:#b6e0d8;stroke:#127c80;stroke-width:4}.flow{fill:none;stroke:#127c80;stroke-width:4;marker-end:url(#arrow)}</style><rect width="900" height="720" rx="24" fill="#faf8f1"/><text x="42" y="53" class="title">Herz &amp; Kreislauf</text><text x="42" y="84" class="small">Zwei Kreisläufe, ein zusammenhängender Weg.</text>
<rect x="325" y="120" width="250" height="68" rx="25" fill="#d9eee7" stroke="#127c80" stroke-width="3"/><text x="450" y="163" text-anchor="middle" class="label">Lunge</text>
<rect x="325" y="540" width="250" height="68" rx="25" fill="#d9eee7" stroke="#127c80" stroke-width="3"/><text x="450" y="583" text-anchor="middle" class="label">Körper</text>
<rect x="140" y="263" width="275" height="96" rx="22" class="organ"/><text x="278" y="304" text-anchor="middle" class="label">Rechter Vorhof</text><text x="278" y="335" text-anchor="middle" class="small">Blut kommt an</text>
<rect x="140" y="407" width="275" height="96" rx="22" class="organ"/><text x="278" y="449" text-anchor="middle" class="label">Rechte Kammer</text><text x="278" y="479" text-anchor="middle" class="small">pumpt zur Lunge</text>
<rect x="485" y="263" width="275" height="96" rx="22" fill="#f1d9bc" stroke="#a66c36" stroke-width="3"/><text x="623" y="304" text-anchor="middle" class="label">Linker Vorhof</text><text x="623" y="335" text-anchor="middle" class="small">Blut kommt an</text>
<rect x="485" y="407" width="275" height="96" rx="22" fill="#f1d9bc" stroke="#a66c36" stroke-width="3"/><text x="623" y="449" text-anchor="middle" class="label">Linke Kammer</text><text x="623" y="479" text-anchor="middle" class="small">pumpt zum Körper</text>
<path d="M278 362V397" class="flow"/><path d="M623 362V397" class="flow"/><path d="M325 575H82V312H127" class="flow"/><path d="M140 455H112V154H313" class="flow"/><path d="M575 154H623V253" class="flow"/><path d="M623 503V575H587" class="flow"/>
<text x="146" y="224" class="small">Lungenarterie ↑</text><text x="637" y="224" class="small">↓ Lungenvenen</text>
<text x="58" y="630" class="small">Pfeile zeigen die Flussrichtung. Herzklappen sind hier nicht eingezeichnet.</text><path d="M42 659H858" stroke="#cedbd8"/><text x="42" y="690" class="small">Lernschema · nicht maßstabsgetreu · keine Diagnosedarstellung</text></svg>